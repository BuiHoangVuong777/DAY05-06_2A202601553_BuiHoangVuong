  <!-- ===== Trợ lý AI: widget nổi góc dưới phải (giữ nguyên UX của rag-app) ===== -->
  <style>
    #tro-ly-nut {
      position: fixed; right: 22px; bottom: 22px; z-index: 9998;
      width: 56px; height: 56px; border: 0; border-radius: 50%; cursor: pointer;
      background: #f97316; color: #fff; display: none; place-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.2); transition: transform .15s;
    }
    #tro-ly-nut:hover { transform: scale(1.06); background: #ea580c; }
    #tro-ly-nut svg { width: 26px; height: 26px; }
    #tro-ly-khung {
      position: fixed; right: 22px; bottom: 90px; z-index: 9999;
      width: 360px; max-width: calc(100vw - 32px); display: none;
      flex-direction: column; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.16);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    #tro-ly-khung.mo { display: flex; }
    #tro-ly-dau {
      display: flex; align-items: center; gap: 8px; padding: 11px 14px;
      background: #fff7ed; border-bottom: 1px solid #fed7aa;
    }
    #tro-ly-dau b { font-size: 13px; color: #9a3412; }
    #tro-ly-dong {
      margin-left: auto; border: 0; background: transparent; cursor: pointer;
      font-size: 19px; line-height: 1; color: #9a3412; padding: 2px 6px; border-radius: 6px;
    }
    #tro-ly-dong:hover { background: #ffedd5; }
    #tro-ly-log {
      height: 320px; overflow-y: auto; padding: 13px;
      display: flex; flex-direction: column; gap: 10px; background: #f8fafc;
    }
    .tl-tin { max-width: 88%; padding: 8px 11px; border-radius: 11px; font-size: 13px; line-height: 1.5; }
    .tl-toi { align-self: flex-end; background: #f97316; color: #fff; border-bottom-right-radius: 4px; }
    .tl-bot { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    .tl-loi { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .tl-noi-dung { white-space: pre-wrap; overflow-wrap: anywhere; }
    .tl-nguon { margin-top: 7px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
    .tl-nguon summary { cursor: pointer; font-size: 11px; color: #64748b; }
    .tl-nguon div { font-size: 11px; color: #64748b; padding: 3px 0; word-break: break-all; }
    .tl-cho { display: flex; gap: 4px; align-items: center; color: #64748b; font-size: 12.5px; }
    .tl-cho i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: tlnhay 1.2s infinite; }
    .tl-cho i:nth-child(3) { animation-delay: .15s } .tl-cho i:nth-child(4) { animation-delay: .3s }
    @keyframes tlnhay { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .tl-cho i { animation: none; opacity: .6 } }
    #tro-ly-form { display: flex; gap: 7px; padding: 10px; border-top: 1px solid #e2e8f0; align-items: flex-end; }
    #tro-ly-o {
      flex: 1; resize: none; font: inherit; font-size: 13px; padding: 8px 10px;
      border: 1px solid #e2e8f0; border-radius: 9px; max-height: 90px; overflow-y: auto;
    }
    #tro-ly-o:focus { outline: 2px solid #f97316; outline-offset: -1px; }
    #tro-ly-gui {
      flex: none; width: 34px; height: 34px; border: 0; border-radius: 9px;
      background: #f97316; color: #fff; cursor: pointer; display: grid; place-items: center;
    }
    #tro-ly-gui:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 520px) {
      #tro-ly-khung { right: 12px; left: 12px; width: auto; bottom: 84px; }
      #tro-ly-log { height: 46vh; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="tai-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;padding:8px 16px;font:13px/1.4 system-ui,sans-serif;text-align:center"></div>
  <div id="root"></div>

  <!-- React App Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // KHUNG TẠM lúc đang tải. Dữ liệu thật lấy từ GET /api/dashboard trong useEffect
    // bên dưới và sẽ ghi đè toàn bộ hai mảng này.
    const initialWeeks = [
      {
        id: 1,
        week: "Tuần 1",
        date: "23/07/2026",
        title: "Kick-off & lập đội",
        status: "completed", // completed, current, upcoming
        milestone: "Lập nhóm & Đăng ký",
        desc: "Khởi động chương trình, giới thiệu thể lệ, ghép đội 4-5 người và nhận tài khoản VLearn/Discord.",
        tasks: ["Tham gia Kick-off", "Ghép nhóm", "Tạo kênh Discord nhóm"]
      },
      {
        id: 2,
        week: "Tuần 2",
        date: "Hiện tại",
        title: "GATE 1 – Chốt đề tài",
        subtitle: "Khảo sát, phân tích đề bài và thu thập thông tin",
        status: "current",
        milestone: "GATE 1 - Chốt đề tài",
        progress: 60,
        desc: "Thực hiện khảo sát tối thiểu 20 người dùng, hoàn thành Problem Canvas và nộp spec.md trước 23:59.",
        tasks: ["Khảo sát 20 HV", "Viết Spec nháp", "Chốt đề tài với TA"]
      },
      {
        id: 3,
        week: "Tuần 3",
        date: "Sắp tới",
        title: "Xây dựng MVP đầu tiên",
        status: "upcoming",
        milestone: "CP2 - Bấm được",
        desc: "Dựng khung luồng chính của ứng dụng (Sketch/Mock), đảm bảo có ít nhất 1 lệnh gọi AI chạy thực tế.",
        tasks: ["Dựng UI nháp", "Call API Gemini", "Test luồng cơ bản"]
      },
      {
        id: 4,
        week: "Tuần 4",
        date: "Sắp tới",
        title: "GATE 2 – MVP",
        subtitle: "Tối ưu và cải thiện dựa trên feedback",
        status: "upcoming",
        milestone: "GATE 2 - MVP Review",
        desc: "Chạy thử nghiệm nội bộ, thu thập feedback, sửa lỗi preflight/blocker và tối ưu độ tin cậy AI.",
        tasks: ["User Testing v1", "Sửa lỗi preflight", "Đo lường Quality Bar"]
      },
      {
        id: 5,
        week: "Tuần 5",
        date: "Sắp tới",
        title: "Hoàn thiện sản phẩm",
        subtitle: "Nộp hồ sơ Demo Day",
        status: "upcoming",
        milestone: "Nộp hồ sơ Demo Day",
        desc: "Đóng gói mã nguồn, viết báo cáo kịch bản lỗi, hoàn thành slide thuyết trình 6 trang.",
        tasks: ["Viết Slide nộp", "Chạy Unit Test", "Đóng gói mã nguồn"]
      },
      {
        id: 6,
        week: "Tuần 6",
        date: "01/09/2026",
        title: "Demo Day",
        status: "upcoming",
        milestone: "Demo Day Pitching",
        desc: "Thuyết trình sản phẩm live trước Hội đồng giám khảo, chạy thử case ngẫu nhiên và nhận điểm tốt nghiệp.",
        tasks: ["Live Demo", "Q&A với Judge", "Nhận phản hồi chung cuộc"]
      }
    ];

    const initialNotifications = [
      {
        id: "n-1",
        source: "Discord",
        type: "Daily Stand-up",
        title: "Nộp Daily Stand-up nhóm P-096",
        time: "09:00 hôm nay",
        status: "todo", // todo, blocked, upcoming, needs_confirmation, done, interested
        details: "Nộp báo cáo tình hình dự án tại kênh Discord #daily-standup trước 9 giờ sáng."
      },
      {
        id: "n-2",
        source: "Discord",
        type: "Office Hour",
        title: "Office Hour – Tool Calling",
        time: "20:00–21:00 hôm nay",
        status: "upcoming",
        details: "Buổi hướng dẫn nâng cao về cách xử lý callback và cấu hình JSON schema."
      },
      {
        id: "n-3",
        source: "VLearn",
        type: "Bài Day 4",
        title: "Hoàn thành bài thực hành Day 4",
        time: "23:59 hôm nay",
        status: "blocked",
        progress: 80,
        blocker: "Lỗi preflight provider",
        details: "Hoàn thành code tích hợp API và đẩy dữ liệu lên pipeline VLearn."
      },
      {
        id: "n-4",
        source: "Discord",
        type: "Mentor Duty",
        title: "Mentor Duty Zone 3",
        time: "19:00 ngày mai",
        status: "upcoming",
        details: "Lịch review 1-1 với Mentor để giải quyết blocker dự án tại phòng Zoom Zone 3."
      },
      {
        id: "n-5",
        source: "Discord",
        type: "Weekly Submit",
        title: "Weekly Submit",
        time: "Chưa xác định",
        status: "needs_confirmation",
        details: "Không tìm thấy ngày và giờ nộp cụ thể. Hệ thống chưa tạo lời nhắc để tránh nhắc sai."
      }
    ];

    // ---- Danh tính người đang đăng nhập -------------------------------
    // Tên tiếng Việt: từ cuối là tên gọi ("Bùi Hoàng Vương" -> "Vương").
    // Mọi hàm đều chịu được nguoiDung = null (lúc chưa tải xong).
    function tenGoi(u) {
      if (!u || !u.display_name) return "bạn";
      const phan = String(u.display_name).trim().split(/\s+/);
      return phan[phan.length - 1] || "bạn";
    }
    function chuCaiDau(u) {
      const t = tenGoi(u);
      return (t && t !== "bạn") ? t.charAt(0).toUpperCase() : "?";
    }
    function nhomCua(u) { return (u && u.team_name) ? u.team_name : "Chưa rõ nhóm"; }
    function emailCua(u) { return (u && u.email) ? u.email : ""; }
    function vaiTroCua(u) { return (u && u.role) ? u.role : ""; }

    function App() {
      const [nguoiDung, setNguoiDung] = useState(null);   // hồ sơ từ /api/dashboard
      const [notifications, setNotifications] = useState(initialNotifications);
      const [weeks, setWeeks] = useState(initialWeeks);
      const [selectedWeek, setSelectedWeek] = useState(weeks.find(w => w.status === 'current') || weeks[1]);

      // ------- Dữ liệu THẬT: GET /api/dashboard (SSOT + lộ trình 6 tuần) -------
      useEffect(() => {
        let huy = false;
        // Đăng xuất: gọi API xoá phiên rồi tự điều hướng. Không đụng state React
        // (trang sẽ rời đi ngay), tránh render lại với dữ liệu rỗng gây lỗi.
        const dangXuat = async (nut) => {
          if (nut) { nut.disabled = true; nut.textContent = "Đang đăng xuất…"; }
          try {
            await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
          } catch (e) {
            // Mất mạng thì vẫn điều hướng: GET /logout sẽ xoá phiên phía server.
          }
          const o = document.getElementById("tai-banner");
          if (o) o.style.display = "none";      // phản hồi tức thì, hết trạng thái cũ
          window.location.replace("/logout");   // xoá phiên lần nữa + về /login
        };

        const bang = (msg, mau, hienNutDangXuat) => {
          const o = document.getElementById("tai-banner");
          if (!o) return;
          if (!msg) { o.style.display = "none"; return; }
          o.replaceChildren();
          const chu = document.createElement("span");
          chu.textContent = msg;
          o.appendChild(chu);
          if (hienNutDangXuat) {
            const nut = document.createElement("button");
            nut.type = "button";
            nut.textContent = "Đăng xuất";
            nut.setAttribute("aria-label", "Đăng xuất khỏi VLearn");
            nut.style.cssText = "margin-left:14px;padding:3px 12px;font:inherit;" +
              "font-size:12px;font-weight:700;border:1px solid currentColor;" +
              "border-radius:6px;background:transparent;color:inherit;cursor:pointer";
            nut.addEventListener("click", () => dangXuat(nut));
            o.appendChild(nut);
          }
          o.style.background = mau === "loi" ? "#fef2f2" : "#fff7ed";
          o.style.color = mau === "loi" ? "#991b1b" : "#9a3412";
          o.style.borderBottom = "1px solid " + (mau === "loi" ? "#fecaca" : "#fed7aa");
          o.style.display = "block";
        };
        bang("Đang tải dữ liệu tiến độ…", "tai");

        fetch("/api/dashboard?mode=weekly", { credentials: "same-origin" })
          .then(async (r) => {
            // Middleware đăng nhập trả 303 -> /login; fetch tự đi theo nên
            // r.redirected = true khi phiên đã hết hạn.
            if (r.redirected && r.url.includes("/login")) { window.location.href = "/login"; return null; }
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
            return d;
          })
          .then((d) => {
            if (!d || huy) return;
            if (Array.isArray(d.weeks) && d.weeks.length) {
              setWeeks(d.weeks);
              setSelectedWeek(d.weeks.find((w) => w.status === "current") || d.weeks[0]);
            }
            if (Array.isArray(d.notifications)) setNotifications(d.notifications);
            // Hiện rõ dashboard đang cá nhân hoá cho ai + gợi ý riêng của họ.
            const nd = (d.meta && d.meta.user) || null;
            setNguoiDung(nd);   // -> header/lời chào hiển thị đúng người
            const cl = (d.meta && d.meta.strategy) || null;
            const canhBao = (d.meta && d.meta.warnings) || [];
            if (nd) {
              const RR = { cao: "rủi ro cao", trung_binh: "rủi ro trung bình", thap: "rủi ro thấp" };
              const phan = [
                `Xin chào ${nd.display_name} · ${nd.role} · ${nd.team_name}`,
                cl ? `${cl.so_lieu.tong} việc đang mở, ${cl.so_lieu.qua_han} quá hạn, ` +
                     `${cl.so_lieu.bi_chan} bị chặn — ${RR[cl.muc_do_rui_ro] || cl.muc_do_rui_ro}` : null,
                cl && cl.viec_can_lam.length ? `Ưu tiên: ${cl.viec_can_lam[0]}` : null,
              ].filter(Boolean);
              bang(phan.join("  |  "),
                   cl && cl.muc_do_rui_ro === "cao" ? "loi" : "tai",
                   true);   // đã đăng nhập -> hiện nút Đăng xuất
            } else {
              bang(canhBao.length ? "Cảnh báo: " + canhBao.join(" · ") : null, "tai");
            }
          })
          .catch((e) => { if (!huy) bang("Không tải được dữ liệu: " + e.message, "loi"); })
        return () => { huy = true; };
      }, []);
      const [activeFilter, setActiveFilter] = useState("Tất cả");
      const [showModal, setShowModal] = useState(false);
      const [currentEditingTask, setCurrentEditingTask] = useState(null);
      
      // Modal inputs
      const [modalProgress, setModalProgress] = useState(50);
      const [modalStatus, setModalStatus] = useState("todo");
      const [modalDesc, setModalDesc] = useState("");

      // App-wide toast
      const [toast, setToast] = useState(null);
      const [appliedPlan, setAppliedPlan] = useState(false); // Applied integrated plan

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Handle Task/Notification Action
      const handleAction = (id, newStatus) => {
        setNotifications(prev => prev.map(n => n.id === id ? { ...n, status: newStatus } : n));
        triggerToast("Cập nhật trạng thái thành công!");
      };

      // Open Checkin Modal
      const openCheckin = (task) => {
        setCurrentEditingTask(task);
        setModalProgress(task.progress || 0);
        setModalStatus(task.status);
        setModalDesc(task.blocker || "");
        setShowModal(true);
      };

      // Save Checkin Modal
      const saveCheckin = () => {
        setNotifications(prev => prev.map(n => {
          if (n.id === currentEditingTask.id) {
            const updated = {
              ...n,
              status: modalStatus,
              progress: Number(modalProgress)
            };
            if (modalStatus === 'blocked') {
              updated.blocker = modalDesc || "Lỗi cấu hình API";
            } else {
              delete updated.blocker;
            }
            if (modalStatus === 'done') {
              updated.progress = 100;
            }
            return updated;
          }
          return n;
        }));
        
        setShowModal(false);
        triggerToast("Đã lưu tiến độ học tập!");

        if (modalStatus === 'blocked') {
          triggerToast("Phát hiện blocker: " + (modalDesc || "Lỗi preflight provider"));
        }
      };

      // Confirm Deadline Form simulated
      const [deadlineInputId, setDeadlineInputId] = useState(null);
      const [newDeadlineText, setNewDeadlineText] = useState("23:59 Chủ Nhật");
      const confirmDeadline = (id) => {
        setNotifications(prev => prev.map(n => n.id === id ? { ...n, status: "todo", time: newDeadlineText } : n));
        setDeadlineInputId(null);
        triggerToast("Đã xác nhận deadline: " + newDeadlineText);
      };

      // Active tabs on mobile view
      const [mobileTab, setMobileTab] = useState("notif");

      // Dynamic rule calculations
      // Tasks to show in "Việc cần làm hôm nay" (max 3)
      const getTodayTasks = () => {
        const list = [];
        const standup = notifications.find(n => n.id === 'n-1');
        if (standup && standup.status !== 'done') {
          list.push({
            id: 'n-1',
            title: "Nộp Daily Stand-up",
            time: "09:00",
            status: standup.status,
            reason: "Deadline gần nhất và chưa hoàn thành"
          });
        }
        const day4 = notifications.find(n => n.id === 'n-3');
        if (day4 && day4.status !== 'done') {
          list.push({
            id: 'n-3',
            title: "Xử lý lỗi preflight",
            time: "20:00 OH",
            status: "Đang bị kẹt",
            reason: "Đang chặn tiến độ bài Day 4"
          });
          list.push({
            id: 'n-3_full',
            title: "Hoàn thành bài Day 4",
            time: "23:59",
            status: `Đang làm (${day4.progress || 80}%)`,
            reason: "Hạn chót 23:59 hôm nay"
          });
        }
        return list.slice(0, 3);
      };

      // Filtered notifications
      const getFilteredNotifs = () => {
        return notifications.filter(n => {
          if (activeFilter === "Tất cả") return true;
          if (activeFilter === "Discord") return n.source === "Discord";
          if (activeFilter === "VLearn") return n.source === "VLearn";
          if (activeFilter === "Hôm nay") return n.time.includes("hôm nay");
          if (activeFilter === "Chưa đọc") return n.status === "todo" || n.status === "blocked" || n.status === "needs_confirmation";
          return true;
        });
      };

      const day4Task = notifications.find(n => n.id === 'n-3') || { progress: 80 };
      const weeklySubmitTask = notifications.find(n => n.id === 'n-5') || { progress: 40 };

      // Helper status badges styling
      const getStatusStyle = (status) => {
        switch(status) {
          case 'completed':
          case 'done':
          case 'interested':
            return 'bg-emerald-50 text-emerald-700 border-emerald-200';
          case 'current':
          case 'in_progress':
            return 'bg-orange-50 text-orange-700 border-orange-200';
          case 'blocked':
            return 'bg-rose-50 text-rose-700 border-rose-200 animate-pulse';
          case 'needs_confirmation':
            return 'bg-purple-50 text-purple-700 border-purple-200';
          default:
            return 'bg-slate-100 text-slate-600 border-slate-200';
        }
      };

      const getStatusLabel = (status) => {
        switch(status) {
          case 'completed':
          case 'done':
            return 'Đã hoàn thành';
          case 'current':
          case 'in_progress':
            return 'Đang thực hiện';
          case 'blocked':
            return 'Đang bị kẹt';

                  {/* Status selection */}
                  <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500">Trạng thái mới</label>
                    <select 
                      value={modalStatus}
                      onChange={(e) => setModalStatus(e.target.value)}
                      class="w-full border border-slate-200 rounded-lg p-2 text-sm bg-white outline-none focus:border-orange-500"
                    >
                      <option value="todo">Chưa bắt đầu</option>
                      <option value="in_progress">Đang thực hiện</option>
                      <option value="blocked">Đang bị kẹt</option>
                      <option value="done">Đã hoàn thành</option>
                    </select>
                  </div>

                  {/* Progress range slider */}
                  <div class="space-y-1.5">
                    <div class="flex justify-between text-xs font-bold text-slate-500">
                      <span>Phần trăm hoàn thành</span>
                      <span class="text-orange-500">{modalProgress}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0" 
                      max="100" 
                      step="5" 
                      value={modalProgress} 
                      onChange={(e) => setModalProgress(e.target.value)}
                      class="w-full accent-orange-500"
                    />
                  </div>

                  {/* Blocker note text area */}
                  <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500">Ghi chú chi tiết / Tên Blocker</label>
                    <textarea 
                      rows="3" 
                      value={modalDesc}
                      onChange={(e) => setModalDesc(e.target.value)}
                      placeholder="Mô tả cụ thể lỗi bạn gặp phải..."
                      class="w-full border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-orange-500"
                    ></textarea>
                  </div>
                </div>

                {/* Footer Buttons */}
                <div class="flex gap-2 justify-end pt-2">
                  <button 
                    onClick={() => setShowModal(false)}
                    class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-xs font-bold transition border border-slate-200"
                  >
                    Hủy bỏ
                  </button>
                  <button 
                    onClick={saveCheckin}
                    class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-sm"
                  >
                    Lưu thay đổi
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Widget trợ lý: nằm ngoài cây React nên không đụng gì tới layout dashboard. -->
  <button id="tro-ly-nut" type="button" aria-label="Mở trợ lý AI" title="Trợ lý AI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </button>

  <section id="tro-ly-khung" aria-label="Trợ lý AI">
    <div id="tro-ly-dau">
      <b>Trợ lý tài liệu</b>
      <button id="tro-ly-dong" type="button" aria-label="Thu nhỏ trợ lý">–</button>
    </div>
    <div id="tro-ly-log"></div>
    <form id="tro-ly-form">
      <textarea id="tro-ly-o" rows="1" placeholder="Hỏi về quy định, gate, deadline…"
                aria-label="Câu hỏi cho trợ lý"></textarea>
      <button id="tro-ly-gui" type="submit" aria-label="Gửi">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>

  <script>
  (function () {
    // Chỉ bật widget khi đã đăng nhập. Trang này vốn đã bị middleware chặn,
    // đây là lớp phòng thủ thứ hai để không hiện trợ lý cho phiên đã hết hạn.
    fetch("/api/me", { credentials: "same-origin" })
      .then((r) => r.json())
      .then((me) => { if (me && me.logged_in) khoiDong(); })
      .catch(() => { /* không xác định được phiên -> không hiện widget */ });

    function khoiDong() {
      var nut = document.getElementById("tro-ly-nut");
      var khung = document.getElementById("tro-ly-khung");
      var log = document.getElementById("tro-ly-log");
      var o = document.getElementById("tro-ly-o");
      var gui = document.getElementById("tro-ly-gui");
      var dangBan = false;

      nut.style.display = "grid";

      function moKhung(mo) {
        khung.classList.toggle("mo", mo);
        nut.style.display = mo ? "none" : "grid";
        localStorage.setItem("troLyMo", mo ? "1" : "0");
        if (mo) o.focus();
      }
      nut.addEventListener("click", function () { moKhung(true); });
      document.getElementById("tro-ly-dong").addEventListener("click", function () { moKhung(false); });
      if (localStorage.getItem("troLyMo") === "1") moKhung(true);

      // Lời chào ban đầu.
      themTin("bot", "Chào bạn! Mình tra cứu được quy định, gate và deadline của Cohort 3. Bạn cần hỏi gì?");

      function themTin(loai, chu) {
        var d = document.createElement("div");
        d.className = "tl-tin " + (loai === "toi" ? "tl-toi" : loai === "loi" ? "tl-loi" : "tl-bot");
        var n = document.createElement("div");
        n.className = "tl-noi-dung";
        n.textContent = chu;          // textContent: không dựng HTML từ dữ liệu
        d.appendChild(n);
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
        return d;
      }

      function tuGian() { o.style.height = "auto"; o.style.height = Math.min(o.scrollHeight, 90) + "px"; }
      o.addEventListener("input", tuGian);
      o.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          document.getElementById("tro-ly-form").requestSubmit();
        }
      });

      document.getElementById("tro-ly-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var cau = o.value.trim();
        if (!cau || dangBan) return;
        o.value = ""; tuGian();
        hoi(cau);
      });

      function hoi(cau) {
        dangBan = true; gui.disabled = true;
        themTin("toi", cau);
        var bong = themTin("bot", "");
        var cho = document.createElement("div");
        cho.className = "tl-cho";
        cho.appendChild(document.createTextNode("đang tra cứu"));
        for (var i = 0; i < 3; i++) cho.appendChild(document.createElement("i"));
        bong.replaceChildren(cho);
        log.scrollTop = log.scrollHeight;

        fetch("/api/chat", {                       // cùng origin -> không dính CORS
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ question: cau, top_k: 4 })
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) {
              if (r.status === 401) { window.location.replace("/login"); return null; }
              if (!r.ok) {
                var ct = d.detail;
                throw new Error(Array.isArray(ct) ? (ct[0] && ct[0].msg) || "Yêu cầu không hợp lệ"
                                                  : (ct || "HTTP " + r.status));
              }
              return d;
            });
          })
          .then(function (d) {
            if (!d) return;
            var noi = document.createElement("div");
            noi.className = "tl-noi-dung";
            noi.textContent = d.answer || "(không có nội dung)";
            bong.replaceChildren(noi);
            if (d.sources && d.sources.length) {
              var ch = document.createElement("details");
              ch.className = "tl-nguon";
              var tt = document.createElement("summary");
              tt.textContent = d.sources.length + " nguồn tham chiếu";
              ch.appendChild(tt);
              d.sources.forEach(function (s, i) {
                var r2 = document.createElement("div");
                r2.textContent = "[" + (i + 1) + "] " + (s.title || s.id) + " — " +
                                 (s.source_file || "") + (s.source_pointer || "");
                ch.appendChild(r2);
              });
              bong.appendChild(ch);
            }
          })
          .catch(function (err) {
            bong.className = "tl-tin tl-loi";
            var n = document.createElement("div");
            n.className = "tl-noi-dung";
            n.textContent = "Lỗi: " + err.message;
            bong.replaceChildren(n);
          })
          .then(function () {
            dangBan = false; gui.disabled = false;
            log.scrollTop = log.scrollHeight;
          });
      }
    }
  })();
  </script>
</body>
</html>
