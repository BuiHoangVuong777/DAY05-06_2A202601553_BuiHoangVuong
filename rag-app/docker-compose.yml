name: rag-app

services:
  chroma:
    image: chromadb/chroma:1.3.0
    restart: unless-stopped
    volumes:
      - chroma-data:/data          # persist_path in the image's /config.yaml
    ports:
      - "${CHROMA_PUBLIC_PORT:-8001}:8000"   # host access for debugging only
    healthcheck:
      # The image has no curl/wget/python — bash /dev/tcp is the only probe available.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        # Bake the same model that the app will load, so the image never needs
        # to download one at run time.
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    restart: unless-stopped
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-rag_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      CHUNKS_PATH: /data/rag_chunks.jsonl
      TOP_K: ${TOP_K:-5}
      AUTO_INGEST: ${AUTO_INGEST:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_1: ${OPENAI_MODEL_1:-gpt-4o-mini}
      OPENAI_MODEL_2: ${OPENAI_MODEL_2:-}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1024}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60}
      HF_HOME: /models                       # model is baked in at build time
      SSOT_DB_PATH: ${SSOT_DB_PATH:-/ssot/ssot.db}
    volumes:
      # Read-only mount of the chunks produced by scripts/build_rag_chunks.py.
      - ../output:/data:ro
      # The progress agent + its SSOT, so /api/agent can run it in-process.
      # Directories (not the .db file directly) — a bind to a missing file would
      # make Docker create a directory in its place.
      - ../agent:/srv/agent:ro
      - ../ssot:/ssot:ro
    ports:
      - "${BACKEND_PUBLIC_PORT:-8000}:8000"  # direct API access for curl/debugging
    depends_on:
      chroma:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # nginx proxies /api here. NGINX_ENVSUBST_FILTER keeps envsubst from eating
      # nginx's own $host / $remote_addr variables in the template.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NGINX_ENVSUBST_FILTER: "^BACKEND_"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  chroma-data:
